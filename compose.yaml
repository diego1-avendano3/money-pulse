name: money-pulse

# Local infrastructure for Phase 0 (walking skeleton): Kafka + PostgreSQL,
# the transaction-api/transaction-processor services, the web PWA, and
# kafka-ui as dev tooling.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp}
      POSTGRES_DB: ${POSTGRES_DB:-moneypulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mp} -d ${POSTGRES_DB:-moneypulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [money-pulse]

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"   # host-only access (debugging / kafka-ui-less tools)
    environment:
      # --- KRaft: a single node acts as both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # --- listeners: INTERNAL for the compose network, EXTERNAL for the host ---
      # advertised.listeners is the address the broker hands back to clients to
      # reconnect on: services inside compose use kafka:9092, host clients use
      # localhost:29092. A single listener would break one of the two.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- single broker: every internal topic needs RF 1 (defaults are 3 -> won't start) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- explicit topology: no auto-create; transactions.received (1 partition,
      #     spec 4.1) is declared by a NewTopic bean in transaction-api (task 5) ---
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [money-pulse]

  transaction-processor:
    build:
      context: .
      dockerfile: apps/transaction-processor/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # INTERNAL listener -- not localhost:29092
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moneypulse}   # Flyway only
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-moneypulse}
      POSTGRES_USER: ${POSTGRES_USER:-mp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp}
    depends_on:
      postgres:
        condition: service_healthy
      # No dependency on kafka: the Kafka client tolerates the broker being
      # unavailable at startup and reconnects lazily in the background (task 6).
      # Postgres/Flyway is the one real startup-ordering problem (spec §4.5).
    healthcheck:
      # readiness only reports UP once Flyway's migration completes (spec §4.5).
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [money-pulse]

  transaction-api:
    build:
      context: .
      dockerfile: apps/transaction-api/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-moneypulse}
      POSTGRES_USER: ${POSTGRES_USER:-mp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mp}
    depends_on:
      postgres:
        condition: service_healthy
      transaction-processor:
        # spec §4.5: don't accept traffic until the processor (and its Flyway
        # migration) is healthy, so the `transactions` table already exists.
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [money-pulse]

  web:
    build:
      context: apps/web   # self-contained npm project -- unlike the Java
                           # services, it doesn't need the rest of the monorepo.
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://transaction-api:8080
    depends_on:
      transaction-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [money-pulse]

  # ---------------------------------------------------------------------------
  # DEV TOOLING — not required by the walking skeleton.
  # Web UI to inspect topics, messages and consumer groups while learning Kafka.
  # Safe to stop/remove; nothing depends on it. To keep `docker compose up` lean,
  # move this service behind `profiles: ["tools"]` and start it on demand with
  # `docker compose --profile tools up`.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"   # 8081 on the host: 8080 is reserved for transaction-api
    environment:
      KAFKA_CLUSTERS_0_NAME: money-pulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [money-pulse]

networks:
  money-pulse:
    name: money-pulse
    driver: bridge

volumes:
  pg-data:
  kafka-data:
