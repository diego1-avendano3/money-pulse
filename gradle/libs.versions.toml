# Shared version catalog for the JVM modules (transaction-api, transaction-processor).
# The `libs.*` accessors are generated by Gradle and available in every build script.

[versions]
spring-boot = "4.1.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
